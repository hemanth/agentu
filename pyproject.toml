[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentu"
version = "2.10.1"
description = "A harness-engineered AI agent runtime with tool isolation, self-correction, and permission scoping"
readme = "README.md"
authors = [
    {name = "Hemanth HM", email = "hemanth.hm@gmail.com"}
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["ai", "agents", "llm", "mcp", "sandbox", "tools", "cli"]
dependencies = [
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
serve = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
search = [
    "ddgs>=7.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24.0",
    "PyYAML>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "ddgs>=7.0.0",
]
semantic = [
    "sentence-transformers>=2.2.0",
]
redis = [
    "redis>=5.0.0",
]
notify = [
    "apprise>=1.0.0",
]
yaml = [
    "PyYAML>=6.0",
]
vectors = [
    "lancedb>=0.6.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
media = [
    "markitdown>=0.0.1a4",
    "youtube-transcript-api>=0.6.0",
]
cache-all = [
    "sentence-transformers>=2.2.0",
    "redis>=5.0.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "ddgs>=7.0.0",
    "PyYAML>=6.0",
    "markitdown>=0.0.1a4",
    "youtube-transcript-api>=0.6.0",
]

[project.scripts]
agentu = "agentu.runtime.cli:main"

[project.urls]
"Homepage" = "https://github.com/hemanth/agentu"
"Documentation" = "https://hemanth.github.io/agentu-codelab/"
"Changelog" = "https://github.com/hemanth/agentu/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/hemanth/agentu/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentu = ["py.typed", "static/*"]
