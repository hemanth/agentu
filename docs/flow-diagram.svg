<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="'IBM Plex Mono', 'SFMono-Regular', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="980" height="420" fill="#ffffff"/>

  <!-- Section headers -->
  <text x="44" y="34" font-size="10" font-weight="600" letter-spacing="0.16em" fill="#000000">INPUT &amp; CONTEXT</text>
  <text x="336" y="34" font-size="10" font-weight="600" letter-spacing="0.16em" fill="#000000">IN-TREE AGENTU RUNTIME</text>
  <text x="736" y="34" font-size="10" font-weight="600" letter-spacing="0.16em" fill="#000000">ISOLATED BOUNDARIES</text>

  <!-- Left column: Inputs -->
  <rect x="36" y="54" width="224" height="328" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <rect x="56" y="76" width="184" height="54" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="70" y="99" font-size="11" font-weight="600" fill="#000000">Prompt + Media[]</text>
  <text x="70" y="117" font-size="9.5" fill="#000000">image · video · audio · pdf</text>

  <rect x="56" y="148" width="184" height="54" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="70" y="171" font-size="11" font-weight="600" fill="#000000">AGENTS.md + Skills</text>
  <text x="70" y="189" font-size="9.5" fill="#000000">3-level progressive load</text>

  <rect x="56" y="220" width="184" height="54" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="70" y="243" font-size="11" font-weight="600" fill="#000000">@tool + Deferred</text>
  <text x="70" y="261" font-size="9.5" fill="#000000">JSON Schema · permissions</text>

  <rect x="56" y="292" width="184" height="68" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="70" y="315" font-size="11" font-weight="600" fill="#000000">Memory &amp; Context</text>
  <text x="70" y="333" font-size="9.5" fill="#000000">SQLite recall · 80% budget</text>
  <text x="70" y="348" font-size="9.5" fill="#000000">tiered auto-compaction</text>

  <!-- Center cluster: In-tree Runtime (solid border) -->
  <rect x="312" y="54" width="364" height="328" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>

  <!-- Input Guardrails + Hooks -->
  <rect x="336" y="76" width="316" height="48" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="352" y="97" font-size="11" font-weight="600" fill="#000000">Input Guardrails · Hooks · Tiered Cache</text>
  <text x="352" y="113" font-size="9.5" fill="#000000">ALLOW / DENY / MODIFY · Lethal Trifecta check</text>

  <!-- THE SIGNATURE INVERTED FOCAL NODE -->
  <rect x="336" y="152" width="316" height="92" rx="8" fill="#000000" stroke="#000000" stroke-width="1.2"/>
  <text x="354" y="178" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#ffffff">AGENT HARNESS ENGINE</text>
  <text x="354" y="199" font-size="10" fill="#ffffff">• Native Tool Loop  |  Code Mode (tools.*)</text>
  <text x="354" y="216" font-size="10" fill="#ffffff">• Write-Ahead Session Checkpointing</text>
  <text x="354" y="233" font-size="10" fill="#ffffff">• Capability-Aware Media Degradation</text>

  <!-- Self-Correction & Validation -->
  <rect x="336" y="274" width="316" height="86" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="352" y="297" font-size="11" font-weight="600" fill="#000000">Self-Correction &amp; InferResult[T]</text>
  <text x="352" y="316" font-size="9.5" fill="#000000">PII / ContentFilter + Pydantic output_type</text>
  <text x="352" y="333" font-size="9.5" fill="#000000">Violation feedback loop → typed .data + .text</text>
  <text x="352" y="349" font-size="9.5" fill="#000000">OTel GenAI spans + Observer trace log</text>

  <!-- Right column: External & Isolated Boundaries (dashed border) -->
  <rect x="728" y="54" width="216" height="154" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="744" y="76" font-size="9.5" font-weight="600" letter-spacing="0.12em" fill="#000000">ZERO-SDK DRIVERS</text>
  <rect x="744" y="88" width="184" height="104" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="758" y="110" font-size="10.5" font-weight="600" fill="#000000">Pooled aiohttp REST/SSE</text>
  <text x="758" y="129" font-size="9.5" fill="#000000">• GeminiDriver (v1beta)</text>
  <text x="758" y="145" font-size="9.5" fill="#000000">• ClaudeDriver (Messages)</text>
  <text x="758" y="161" font-size="9.5" fill="#000000">• OpenAIDriver / Groq / DS</text>
  <text x="758" y="177" font-size="9.5" fill="#000000">• OllamaDriver (local)</text>

  <rect x="728" y="226" width="216" height="156" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="744" y="248" font-size="9.5" font-weight="600" letter-spacing="0.12em" fill="#000000">TOOL SANDBOX &amp; MCP</text>
  <rect x="744" y="260" width="184" height="106" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="758" y="281" font-size="10.5" font-weight="600" fill="#000000">Subprocess Isolation</text>
  <text x="758" y="299" font-size="9.5" fill="#000000">• READONLY / WRITE / DENY</text>
  <text x="758" y="315" font-size="9.5" fill="#000000">• RLIMIT_AS memory cap</text>
  <text x="758" y="331" font-size="9.5" fill="#000000">• Outbound network block</text>
  <text x="758" y="347" font-size="9.5" fill="#000000">• MCP HTTP / STDIO / Git WT</text>

  <!-- Orthogonal routing arrows -->
  <!-- Inputs -> Guardrails / Engine -->
  <path d="M 260 100 L 334 100" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 260 184 L 334 184" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Guardrails -> Engine -->
  <path d="M 494 124 L 494 150" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Engine <-> Drivers -->
  <path d="M 652 178 L 690 178 Q 698 178 698 170 L 698 148 Q 698 140 706 140 L 742 140" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 744 156 L 714 156 Q 706 156 706 164 L 706 186 Q 706 194 698 194 L 654 194" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Engine <-> Sandbox -->
  <path d="M 652 216 L 698 216 Q 706 216 706 224 L 706 296 Q 706 304 714 304 L 742 304" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 744 322 L 706 322 Q 698 322 698 314 L 698 238 Q 698 230 690 230 L 654 230" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Engine -> Validation & Self-correction loop back -->
  <path d="M 494 244 L 494 272" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 336 316 L 325 316 Q 319 316 319 308 L 319 220 Q 319 212 327 212 L 334 212" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
